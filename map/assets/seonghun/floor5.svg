<svg viewBox="0 0 940 610" role="img" aria-label="성훈관 5층 구조도 정리본. 복도와 화장실은 기존 구조를 유지하고, 나머지 공간은 제거했다. 복도 왼쪽에는 작은 교수실 여러 개가 붙어 있다." xmlns="http://www.w3.org/2000/svg" id="seonghun-5f-clean" style="--font-size-base:16px;--background: #f8fafc;--foreground: #1f2937;--card: #ffffff;--primary-foreground: #ffffff;--muted: #e5e7eb;--muted-foreground: #64748b;--border: #cbd5e1;--accent: #e0f2fe;--yellow: #facc15;--purple: #8b5cf6;--green: #22c55e;--blue: #3b82f6;--orange: #f97316;--red: #ef4444;--viz-series-1: #4f6488;background:#f8fafc;font-family:system-ui,sans-serif">
    <style>
    #seonghun-5f-clean {
      display: grid;
      gap: calc(var(--font-size-base) * 0.75);
      color: var(--foreground);
    }

    #seonghun-5f-clean .title {
      display: grid;
      gap: calc(var(--font-size-base) * 0.25);
    }

    #seonghun-5f-clean svg {
      display: block;
      width: 100%;
      height: auto;
    }

    #seonghun-5f-clean text {
      fill: var(--foreground);
      font-size: 15px;
      font-weight: 400;
    }

    #seonghun-5f-clean .small {
      fill: var(--muted-foreground);
      font-size: 13px;
    }

    #seonghun-5f-clean .tiny {
      fill: var(--foreground);
      font-size: 12px;
    }

    #seonghun-5f-clean .building {
      fill: color-mix(in srgb, var(--muted) 54%, transparent);
      stroke: var(--foreground);
      stroke-width: 3;
    }

    #seonghun-5f-clean .corridor {
      fill: color-mix(in srgb, var(--yellow) 22%, transparent);
      stroke: var(--foreground);
      stroke-width: 2.5;
    }

    #seonghun-5f-clean .lecture {
      fill: color-mix(in srgb, var(--viz-series-1) 16%, transparent);
      stroke: var(--foreground);
      stroke-width: 2;
    }

    #seonghun-5f-clean .study {
      fill: color-mix(in srgb, var(--purple) 18%, transparent);
      stroke: var(--foreground);
      stroke-width: 2;
    }

    #seonghun-5f-clean .lab-main {
      fill: color-mix(in srgb, var(--green) 18%, transparent);
      stroke: var(--foreground);
      stroke-width: 2;
    }

    #seonghun-5f-clean .office {
      fill: color-mix(in srgb, var(--blue) 16%, transparent);
      stroke: var(--foreground);
      stroke-width: 2;
    }

    #seonghun-5f-clean .room {
      fill: color-mix(in srgb, var(--card) 70%, transparent);
      stroke: var(--foreground);
      stroke-width: 1.8;
    }

    #seonghun-5f-clean .restroom {
      fill: color-mix(in srgb, var(--yellow) 30%, transparent);
      stroke: var(--foreground);
      stroke-width: 2;
    }

    #seonghun-5f-clean .stairs {
      fill: color-mix(in srgb, var(--orange) 18%, transparent);
      stroke: var(--foreground);
      stroke-width: 2;
    }

    #seonghun-5f-clean .door {
      fill: var(--foreground);
    }

    #seonghun-5f-clean .thin {
      fill: none;
      stroke: var(--border);
      stroke-width: 1.3;
    }

    #seonghun-5f-clean .pin {
      fill: color-mix(in srgb, var(--viz-series-1) 72%, var(--foreground));
      stroke: var(--background);
      stroke-width: 2;
    }

    #seonghun-5f-clean .pin-text {
      fill: var(--primary-foreground);
      font-size: 14px;
      font-weight: 500;
    }

    #seonghun-5f-clean .legend text {
      font-size: 14px;
    }
  </style><title>성훈관 5층 구조도 정리본</title>
    <desc>사용자가 그린 스케치를 기준으로 중앙도서관 안내도 스타일을 참고해 정리한 성훈관 5층 가상 구조도이다. 복도와 화장실을 유지하고, 복도 왼쪽에 소형 교수실을 촘촘히 배치했다.</desc>

    <rect x="24" y="64" width="710" height="430" rx="2" class="building" />

    <rect x="178" y="270" width="430" height="58" rx="2" class="corridor" />
    <text x="393" y="305" text-anchor="middle">복도</text>

    <rect x="188" y="328" width="52" height="94" rx="2" class="room" />
    <text x="214" y="367" text-anchor="middle" class="tiny">박용호</text>
    <text x="214" y="387" text-anchor="middle" class="tiny">교수실</text>

    <rect x="248" y="328" width="52" height="94" rx="2" class="room" />
    <text x="274" y="367" text-anchor="middle" class="tiny">우창용</text>
    <text x="274" y="387" text-anchor="middle" class="tiny">교수실</text>

    <rect x="308" y="328" width="52" height="94" rx="2" class="room" />
    <text x="334" y="367" text-anchor="middle" class="tiny">이상훈</text>
    <text x="334" y="387" text-anchor="middle" class="tiny">교수실</text>

    <rect x="368" y="328" width="52" height="94" rx="2" class="room" />
    <text x="394" y="367" text-anchor="middle" class="tiny">김재용</text>
    <text x="394" y="387" text-anchor="middle" class="tiny">교수실</text>

    <rect x="428" y="328" width="52" height="94" rx="2" class="room" />
    <text x="454" y="367" text-anchor="middle" class="tiny">김경수</text>
    <text x="454" y="387" text-anchor="middle" class="tiny">교수실</text>

    <rect x="476" y="328" width="58" height="102" rx="2" class="restroom" />
    <text x="505" y="371" text-anchor="middle" class="tiny">화장실</text>
    <text x="505" y="391" text-anchor="middle" class="tiny">연구실</text>
    <text x="505" y="411" text-anchor="middle" class="tiny">라인 끝</text>

    <rect x="552" y="328" width="42" height="102" rx="2" class="stairs" />
    <line x1="562" y1="342" x2="584" y2="342" class="thin" />
    <line x1="562" y1="358" x2="584" y2="358" class="thin" />
    <line x1="562" y1="374" x2="584" y2="374" class="thin" />
    <line x1="562" y1="390" x2="584" y2="390" class="thin" />
    <line x1="562" y1="406" x2="584" y2="406" class="thin" />
    <text x="573" y="448" text-anchor="middle" class="small">계단</text>

    <circle cx="393" cy="299" r="14" class="pin" />
    <text x="393" y="304" text-anchor="middle" class="pin-text">1</text>
    <circle cx="334" cy="375" r="14" class="pin" />
    <text x="334" y="380" text-anchor="middle" class="pin-text">2</text>
    <circle cx="573" cy="379" r="14" class="pin" />
    <text x="573" y="384" text-anchor="middle" class="pin-text">3</text>
    <circle cx="505" cy="379" r="14" class="pin" />
    <text x="505" y="384" text-anchor="middle" class="pin-text">4</text>
    <g class="legend" transform="translate(735 106)">
      <text x="0" y="-28" font-size="16">범례</text>
      <circle cx="13" cy="0" r="13" class="pin" />
      <text x="13" y="5" text-anchor="middle" class="pin-text">1</text>
      <text x="36" y="5">복도</text>

      <circle cx="13" cy="38" r="13" class="pin" />
      <text x="13" y="43" text-anchor="middle" class="pin-text">2</text>
      <text x="36" y="43">교수실 구역</text>

      <circle cx="13" cy="76" r="13" class="pin" />
      <text x="13" y="81" text-anchor="middle" class="pin-text">3</text>
      <text x="36" y="81">계단</text>

      <circle cx="13" cy="114" r="13" class="pin" />
      <text x="13" y="119" text-anchor="middle" class="pin-text">4</text>
      <text x="36" y="119">화장실</text>
    </g>
  </svg>