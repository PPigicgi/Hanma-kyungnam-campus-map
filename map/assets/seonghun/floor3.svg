<svg viewBox="0 0 940 610" role="img" aria-label="성훈관 3층 구조도 정리본. 2층과 같은 구조에서 방 이름만 3층 안내도 기준으로 바꿨다. 긴 복도, 디지털공학실험실, 계단, 화장실, 전자과 학과사무실, 교수 사무실, 대표 3층 실험실 3개를 표시한다." xmlns="http://www.w3.org/2000/svg" id="seonghun-3f-clean" style="--font-size-base:16px;--background: #f8fafc;--foreground: #1f2937;--card: #ffffff;--primary-foreground: #ffffff;--muted: #e5e7eb;--muted-foreground: #64748b;--border: #cbd5e1;--accent: #e0f2fe;--yellow: #facc15;--purple: #8b5cf6;--green: #22c55e;--blue: #3b82f6;--orange: #f97316;--red: #ef4444;--viz-series-1: #4f6488;background:#f8fafc;font-family:system-ui,sans-serif">
    <style>
    #seonghun-3f-clean {
      display: grid;
      gap: calc(var(--font-size-base) * 0.75);
      color: var(--foreground);
    }

    #seonghun-3f-clean .title {
      display: grid;
      gap: calc(var(--font-size-base) * 0.25);
    }

    #seonghun-3f-clean svg {
      display: block;
      width: 100%;
      height: auto;
    }

    #seonghun-3f-clean text {
      fill: var(--foreground);
      font-size: 15px;
      font-weight: 400;
    }

    #seonghun-3f-clean .small {
      fill: var(--muted-foreground);
      font-size: 13px;
    }

    #seonghun-3f-clean .tiny {
      fill: var(--foreground);
      font-size: 12px;
    }

    #seonghun-3f-clean .building {
      fill: color-mix(in srgb, var(--muted) 54%, transparent);
      stroke: var(--foreground);
      stroke-width: 3;
    }

    #seonghun-3f-clean .corridor {
      fill: color-mix(in srgb, var(--yellow) 22%, transparent);
      stroke: var(--foreground);
      stroke-width: 2.5;
    }

    #seonghun-3f-clean .lecture {
      fill: color-mix(in srgb, var(--viz-series-1) 16%, transparent);
      stroke: var(--foreground);
      stroke-width: 2;
    }

    #seonghun-3f-clean .study {
      fill: color-mix(in srgb, var(--purple) 18%, transparent);
      stroke: var(--foreground);
      stroke-width: 2;
    }

    #seonghun-3f-clean .lab-main {
      fill: color-mix(in srgb, var(--green) 18%, transparent);
      stroke: var(--foreground);
      stroke-width: 2;
    }

    #seonghun-3f-clean .office {
      fill: color-mix(in srgb, var(--blue) 16%, transparent);
      stroke: var(--foreground);
      stroke-width: 2;
    }

    #seonghun-3f-clean .room {
      fill: color-mix(in srgb, var(--card) 70%, transparent);
      stroke: var(--foreground);
      stroke-width: 1.8;
    }

    #seonghun-3f-clean .restroom {
      fill: color-mix(in srgb, var(--yellow) 30%, transparent);
      stroke: var(--foreground);
      stroke-width: 2;
    }

    #seonghun-3f-clean .stairs {
      fill: color-mix(in srgb, var(--orange) 18%, transparent);
      stroke: var(--foreground);
      stroke-width: 2;
    }

    #seonghun-3f-clean .door {
      fill: var(--foreground);
    }

    #seonghun-3f-clean .thin {
      fill: none;
      stroke: var(--border);
      stroke-width: 1.3;
    }

    #seonghun-3f-clean .pin {
      fill: color-mix(in srgb, var(--viz-series-1) 72%, var(--foreground));
      stroke: var(--background);
      stroke-width: 2;
    }

    #seonghun-3f-clean .pin-text {
      fill: var(--primary-foreground);
      font-size: 14px;
      font-weight: 500;
    }

    #seonghun-3f-clean .legend text {
      font-size: 14px;
    }
  </style><title>성훈관 3층 구조도 정리본</title>
    <desc>사용자가 그린 스케치를 기준으로 중앙도서관 안내도 스타일을 참고해 정리한 성훈관 3층 가상 구조도이다. 2층 구조를 유지하고 방 이름만 3층 안내도 기준으로 바꿨다.</desc>

    <rect x="24" y="64" width="710" height="430" rx="2" class="building" />

    <rect x="178" y="270" width="430" height="58" rx="2" class="corridor" />
    <text x="393" y="305" text-anchor="middle">복도</text>

    <rect x="46" y="210" width="132" height="134" rx="2" class="lecture" />
    <text x="112" y="264" text-anchor="middle">디지털공학</text>
    <text x="112" y="286" text-anchor="middle">실험실</text>
    <text x="112" y="315" text-anchor="middle" class="small">복도 끝</text>

    <rect x="610" y="214" width="120" height="120" rx="2" class="lab-main" />
    <text x="670" y="262" text-anchor="middle" class="tiny">전자과</text>
    <text x="670" y="282" text-anchor="middle" class="tiny">학과</text>
    <text x="670" y="302" text-anchor="middle" class="tiny">사무실</text>

    <rect x="610" y="334" width="82" height="132" rx="2" class="office" />
    <text x="651" y="356" text-anchor="middle" class="tiny">교수</text>
    <text x="651" y="374" text-anchor="middle" class="tiny">사무실</text>
    <rect x="610" y="392" width="10" height="38" rx="1" class="door" />
    <rect x="626" y="396" width="54" height="26" rx="1" class="room" />
    <text x="653" y="414" text-anchor="middle" class="tiny">내부복도</text>
    <rect x="626" y="366" width="38" height="22" rx="1" class="room" />
    <text x="645" y="382" text-anchor="middle" class="tiny">사무실</text>

    <rect x="198" y="328" width="82" height="102" rx="2" class="room" />
    <text x="239" y="371" text-anchor="middle" class="tiny">안테나·RF</text>
    <text x="239" y="391" text-anchor="middle" class="tiny">응용실험실</text>

    <rect x="290" y="328" width="86" height="102" rx="2" class="room" />
    <text x="333" y="371" text-anchor="middle" class="tiny">기초전기</text>
    <text x="333" y="391" text-anchor="middle" class="tiny">실험실</text>

    <rect x="386" y="328" width="80" height="102" rx="2" class="room" />
    <text x="426" y="371" text-anchor="middle" class="tiny">임베디드</text>
    <text x="426" y="391" text-anchor="middle" class="tiny">SW실험실</text>

    <rect x="476" y="328" width="58" height="102" rx="2" class="restroom" />
    <text x="505" y="371" text-anchor="middle" class="tiny">화장실</text>
    <text x="505" y="391" text-anchor="middle" class="tiny">연구실</text>
    <text x="505" y="411" text-anchor="middle" class="tiny">라인 끝</text>

    <rect x="552" y="328" width="42" height="102" rx="2" class="stairs" />
    <line x1="562" y1="342" x2="584" y2="342" class="thin" />
    <line x1="562" y1="358" x2="584" y2="358" class="thin" />
    <line x1="562" y1="374" x2="584" y2="374" class="thin" />
    <line x1="562" y1="390" x2="584" y2="390" class="thin" />
    <line x1="562" y1="406" x2="584" y2="406" class="thin" />
    <text x="573" y="448" text-anchor="middle" class="small">계단</text>

    <circle cx="393" cy="299" r="14" class="pin" />
    <text x="393" y="304" text-anchor="middle" class="pin-text">1</text>
    <circle cx="112" cy="277" r="14" class="pin" />
    <text x="112" y="282" text-anchor="middle" class="pin-text">2</text>
    <circle cx="573" cy="379" r="14" class="pin" />
    <text x="573" y="384" text-anchor="middle" class="pin-text">3</text>
    <circle cx="505" cy="379" r="14" class="pin" />
    <text x="505" y="384" text-anchor="middle" class="pin-text">4</text>
    <circle cx="670" cy="274" r="14" class="pin" />
    <text x="670" y="279" text-anchor="middle" class="pin-text">5</text>
    <circle cx="651" cy="400" r="14" class="pin" />
    <text x="651" y="405" text-anchor="middle" class="pin-text">6</text>
    <circle cx="333" cy="379" r="14" class="pin" />
    <text x="333" y="384" text-anchor="middle" class="pin-text">7</text>

    <g class="legend" transform="translate(735 106)">
      <text x="0" y="-28" font-size="16">범례</text>
      <circle cx="13" cy="0" r="13" class="pin" />
      <text x="13" y="5" text-anchor="middle" class="pin-text">1</text>
      <text x="36" y="5">복도</text>

      <circle cx="13" cy="38" r="13" class="pin" />
      <text x="13" y="43" text-anchor="middle" class="pin-text">2</text>
      <text x="36" y="43">디지털공학실험실</text>

      <circle cx="13" cy="76" r="13" class="pin" />
      <text x="13" y="81" text-anchor="middle" class="pin-text">3</text>
      <text x="36" y="81">계단</text>

      <circle cx="13" cy="114" r="13" class="pin" />
      <text x="13" y="119" text-anchor="middle" class="pin-text">4</text>
      <text x="36" y="119">화장실</text>

      <circle cx="13" cy="152" r="13" class="pin" />
      <text x="13" y="157" text-anchor="middle" class="pin-text">5</text>
      <text x="36" y="157">전자과 학과사무실</text>

      <circle cx="13" cy="190" r="13" class="pin" />
      <text x="13" y="195" text-anchor="middle" class="pin-text">6</text>
      <text x="36" y="195">교수 사무실</text>

      <circle cx="13" cy="228" r="13" class="pin" />
      <text x="13" y="233" text-anchor="middle" class="pin-text">7</text>
      <text x="36" y="233">대표 3층 실험실 3개</text>
    </g>
  </svg>