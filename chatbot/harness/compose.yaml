services:
  campus-chat:
    build:
      context: ..
      dockerfile: harness/Dockerfile
    ports:
      - "127.0.0.1:8765:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ../kyungnam.db:/data/kyungnam.db:ro
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
